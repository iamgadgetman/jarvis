# One tag, one release, three files. Pushing a tag such as v0.17.0 builds
# the Paper plugin, the Fabric mod and the NeoForge mod, checks that each
# jar carries the tagged version, and publishes a GitHub release with the
# three jars attached and the matching CHANGELOG section as its notes.
#
# Running it from the Actions page with a version does the same from the
# current commit and creates the tag itself, for whoever cannot push tags.
#
# Modrinth and CurseForge publishing rides on the same run and switches
# itself on when the secrets exist (MODRINTH_TOKEN with MODRINTH_ID;
# CURSEFORGE_TOKEN with CURSEFORGE_PLUGIN_ID for the plugin project on
# dev.bukkit.org and CURSEFORGE_MOD_ID for the mods project, which
# CurseForge keeps apart). Without them the GitHub release is the whole
# of it. docs/dev/releasing.md says where each secret comes from.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in the poms (e.g. 0.17.0); the tag v<version> is created on this commit'
        required: true
        type: string

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-paper
          path: jarvis-paper/target/jarvis-paper-*.jar
          if-no-files-found: error

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - working-directory: jarvis-fabric
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-fabric
          path: jarvis-fabric/build/libs/jarvis-fabric-*.jar
          if-no-files-found: error

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - working-directory: jarvis-neoforge
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-neoforge
          path: jarvis-neoforge/build/libs/jarvis-neoforge-*.jar
          if-no-files-found: error

  release:
    needs: [paper, fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the jars carry the tagged version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l dist
          for name in jarvis-paper jarvis-fabric jarvis-neoforge; do
            test -f "dist/$name-$VERSION.jar" || {
              echo "::error::dist/$name-$VERSION.jar is missing: the version asked for ($VERSION) and the version in the poms and gradle.properties do not agree"
              exit 1
            }
          done
          # Sources, javadoc and dev jars are not for players.
          find dist -name '*.jar' ! -name "jarvis-*-$VERSION.jar" -delete
          ls -l dist

      - name: Take the release notes from the CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## v/ { if (found) exit; if (index($0, "## v" v " ") == 1 || $0 == "## v" v) { found = 1; title = $0; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section for v$VERSION; the release gets a short note"
            echo "Jarvis $VERSION: the Paper plugin, the Fabric mod and the NeoForge mod." > notes.md
          fi
          {
            echo
            echo "| Server | File |"
            echo "|---|---|"
            echo "| Paper / Purpur | \`jarvis-paper-$VERSION.jar\` (needs Citizens) |"
            echo "| Fabric | \`jarvis-fabric-$VERSION.jar\` (needs Fabric API) |"
            echo "| NeoForge | \`jarvis-neoforge-$VERSION.jar\` |"
          } >> notes.md
          cat notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jarvis ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: dist/jarvis-*.jar
          fail_on_unmatched_files: true

      # ---- Modrinth and CurseForge, through .github/scripts/publish.py ----
      # Each step runs only when its secrets exist; without them the GitHub
      # release above is the whole of it. Modrinth takes all three files in
      # one project, as Simple Voice Chat does; CurseForge keeps Bukkit
      # plugins (dev.bukkit.org) and mods apart, so it needs two projects.
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_ID != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
          V: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/publish.py modrinth --project "$MODRINTH_ID" \
            --file "dist/jarvis-paper-$V.jar" --version "$V+paper" --name "Jarvis $V for Paper" \
            --loaders paper purpur --game-versions 1.21.11..26.2 \
            --deps simple-voice-chat:optional --changelog notes.md
          python3 .github/scripts/publish.py modrinth --project "$MODRINTH_ID" \
            --file "dist/jarvis-fabric-$V.jar" --version "$V+fabric" --name "Jarvis $V for Fabric" \
            --loaders fabric --game-versions 26.3 \
            --deps fabric-api:required simple-voice-chat:optional --changelog notes.md
          python3 .github/scripts/publish.py modrinth --project "$MODRINTH_ID" \
            --file "dist/jarvis-neoforge-$V.jar" --version "$V+neoforge" --name "Jarvis $V for NeoForge" \
            --loaders neoforge --game-versions 26.3 \
            --deps simple-voice-chat:optional --changelog notes.md

      - name: CurseForge, the plugin (dev.bukkit.org)
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PLUGIN_ID != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PLUGIN_ID: ${{ secrets.CURSEFORGE_PLUGIN_ID }}
          V: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/publish.py curseforge --host dev.bukkit.org --project "$CURSEFORGE_PLUGIN_ID" \
            --file "dist/jarvis-paper-$V.jar" --name "Jarvis $V for Paper" \
            --game-versions 1.21.11..26.2 --changelog notes.md

      - name: CurseForge, the mods (minecraft.curseforge.com)
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_MOD_ID != ''
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_MOD_ID: ${{ secrets.CURSEFORGE_MOD_ID }}
          V: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/publish.py curseforge --host minecraft.curseforge.com --project "$CURSEFORGE_MOD_ID" \
            --file "dist/jarvis-fabric-$V.jar" --name "Jarvis $V for Fabric" \
            --game-versions 26.3 --extra Fabric "Java 25" Server \
            --deps fabric-api:requiredDependency simple-voice-chat:optionalDependency --changelog notes.md
          python3 .github/scripts/publish.py curseforge --host minecraft.curseforge.com --project "$CURSEFORGE_MOD_ID" \
            --file "dist/jarvis-neoforge-$V.jar" --name "Jarvis $V for NeoForge" \
            --game-versions 26.3 --extra NeoForge "Java 25" Server \
            --deps simple-voice-chat:optionalDependency --changelog notes.md

# One tag, one release, three files. Pushing a tag such as v0.17.0 builds
# the Paper plugin, the Fabric mod and the NeoForge mod, checks that each
# jar carries the tagged version, and publishes a GitHub release with the
# three jars attached and the matching CHANGELOG section as its notes.
#
# Running it from the Actions page with a version does the same from the
# current commit and creates the tag itself, for whoever cannot push tags.
#
# Modrinth and CurseForge publishing rides on the same run and switches
# itself on when the secrets exist (MODRINTH_TOKEN with MODRINTH_ID;
# CURSEFORGE_TOKEN with CURSEFORGE_PLUGIN_ID for the plugin project and
# CURSEFORGE_MOD_ID for the mod project, which CurseForge keeps apart).
# Without them the GitHub release is the whole of it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in the poms (e.g. 0.17.0); the tag v<version> is created on this commit'
        required: true
        type: string

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-paper
          path: jarvis-paper/target/jarvis-paper-*.jar
          if-no-files-found: error

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - working-directory: jarvis-fabric
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-fabric
          path: jarvis-fabric/build/libs/jarvis-fabric-*.jar
          if-no-files-found: error

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - working-directory: jarvis-neoforge
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-neoforge
          path: jarvis-neoforge/build/libs/jarvis-neoforge-*.jar
          if-no-files-found: error

  release:
    needs: [paper, fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the jars carry the tagged version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l dist
          for name in jarvis-paper jarvis-fabric jarvis-neoforge; do
            test -f "dist/$name-$VERSION.jar" || {
              echo "::error::dist/$name-$VERSION.jar is missing: the version asked for ($VERSION) and the version in the poms and gradle.properties do not agree"
              exit 1
            }
          done
          # Sources, javadoc and dev jars are not for players.
          find dist -name '*.jar' ! -name "jarvis-*-$VERSION.jar" -delete
          ls -l dist

      - name: Take the release notes from the CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## v/ { if (found) exit; if (index($0, "## v" v " ") == 1 || $0 == "## v" v) { found = 1; title = $0; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section for v$VERSION; the release gets a short note"
            echo "Jarvis $VERSION: the Paper plugin, the Fabric mod and the NeoForge mod." > notes.md
          fi
          {
            echo
            echo "| Server | File |"
            echo "|---|---|"
            echo "| Paper / Purpur | \`jarvis-paper-$VERSION.jar\` (needs Citizens) |"
            echo "| Fabric | \`jarvis-fabric-$VERSION.jar\` (needs Fabric API) |"
            echo "| NeoForge | \`jarvis-neoforge-$VERSION.jar\` |"
          } >> notes.md
          cat notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jarvis ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: dist/jarvis-*.jar
          fail_on_unmatched_files: true

      # ---- Modrinth: one project, three files per version ----
      - name: Modrinth, Paper
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/jarvis-paper-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for Paper
          version: ${{ steps.version.outputs.version }}+paper
          version-type: release
          changelog-file: notes.md
          loaders: paper purpur
          game-versions: '>=1.21.11 <26.3'
          java: 21 25
          dependencies: simple-voice-chat(optional)
      - name: Modrinth, Fabric
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/jarvis-fabric-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for Fabric
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: release
          changelog-file: notes.md
          loaders: fabric
          game-versions: '26.3'
          java: 25
          dependencies: |
            fabric-api(required)
            simple-voice-chat(optional)
      - name: Modrinth, NeoForge
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/jarvis-neoforge-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for NeoForge
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: release
          changelog-file: notes.md
          loaders: neoforge
          game-versions: '26.3'
          java: 25
          dependencies: simple-voice-chat(optional)

      # ---- CurseForge: plugins and mods are separate projects there ----
      - name: CurseForge, Paper
        if: env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PLUGIN_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/jarvis-paper-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for Paper
          version: ${{ steps.version.outputs.version }}+paper
          version-type: release
          changelog-file: notes.md
          loaders: paper purpur
          game-versions: '>=1.21.11 <26.3'
          java: 21 25
      - name: CurseForge, Fabric
        if: env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_MOD_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/jarvis-fabric-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for Fabric
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: release
          changelog-file: notes.md
          loaders: fabric
          game-versions: '26.3'
          java: 25
          dependencies: fabric-api(required)
      - name: CurseForge, NeoForge
        if: env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_MOD_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/jarvis-neoforge-*.jar
          name: Jarvis ${{ steps.version.outputs.version }} for NeoForge
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: release
          changelog-file: notes.md
          loaders: neoforge
          game-versions: '26.3'
          java: 25

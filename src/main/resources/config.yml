# Jarvis AI Companion Configuration
# Version 0.8.2

# ========== AI CONFIGURATION ==========
ai:
  # Provider options: openai, claude, gemini, grok, ollama, auto
  # "auto" will try providers in priority order, switching on failure
  provider: auto

  # ---- v0.3.0 tiered routing ----
  # Light work (chat intents, banter) runs on Ollama first when configured;
  # heavy work (build planning) prefers your cloud provider. Override here:
  # routing:
  #   light: [ollama, claude]
  #   heavy: [claude, ollama]
  light-timeout-seconds: 5       # Light-tier timeout; slow local box -> fall through
  reduced-mode:
    allow-risky-actions: false   # Ollama-only mode: allow console/permission actions

  # Provider priority for auto mode (tried top-to-bottom)
  # Providers without API keys (except ollama) are skipped.
  #
  # ollama is first on purpose: it is free and local, so a server that runs it
  # pays nothing for routine chat parsing. If it is not installed the call
  # fails fast (connection refused) and the provider is put on an exponential
  # cooldown up to 5 minutes, so the cost to everyone else is negligible.
  provider-priority:
    - ollama
    - claude
    - openai
    - grok
    - gemini

  # OpenAI - https://platform.openai.com/
  #   gpt-5.6-terra  balanced intelligence/cost (default)
  #   gpt-5.6-luna   cost-optimised -- good for high-traffic servers
  #   gpt-5.6-sol    flagship
  openai:
    api-key: ""
    model: gpt-5.6-terra
    endpoint: ""  # Leave blank for default
    timeout-seconds: 30

  # Claude - https://console.anthropic.com/
  # Model IDs are complete as written; do not append a date suffix.
  #   claude-haiku-4-5 cheapest and fastest (default) -- a server parsing every
  #                    chat line makes a lot of calls, so this is the sane floor
  #   claude-sonnet-5  stronger, mid cost
  #   claude-opus-5    most capable, most expensive
  claude:
    api-key: ""
    model: claude-haiku-4-5
    endpoint: ""  # Leave blank for default
    timeout-seconds: 30

  # xAI Grok - https://x.ai/
  #   grok-4.6  xAI's recommended default (default)
  #   grok-4.3  cheaper
  grok:
    api-key: ""
    model: grok-4.6
    endpoint: ""  # Leave blank for default
    timeout-seconds: 30

  # Google Gemini - https://aistudio.google.com/
  #   gemini-3.7-flash       latest and most capable Flash (default)
  #   gemini-3.5-flash-lite  fastest and cheapest
  gemini:
    api-key: ""
    model: gemini-3.7-flash
    endpoint: ""  # Leave blank for default
    timeout-seconds: 30

  # Ollama - Local LLM server (no API key required)
  # Install: https://ollama.ai
  # Pull model: ollama pull mistral
  ollama:
    endpoint: "http://localhost:11434"
    model: mistral  # Options: mistral, llama3.2, neural-chat, etc.
    keep-alive: "5m"  # Keep model loaded in memory
    timeout-seconds: 60  # Local models may be slower

# ========== EXPERIENCE MEMORY ==========
# Jarvis remembers how past builds turned out and shows the AI the plans that
# worked for similar requests. Labels come from behaviour, not a rating prompt:
# a build you let finish is a success, one you cancel or undo is not.
#
# Embeddings are computed by Ollama and never fall back to a paid provider, so
# this feature costs nothing to run. If Ollama is down, retrieval degrades to
# keyword matching rather than failing.
memory:
  enabled: true

  # Pull it first:  ollama pull nomic-embed-text
  # Uses ai.ollama.endpoint above -- one box, one setting.
  embedding-model: "nomic-embed-text"
  # Measured against a reference Ollama box: 14.3s to load the model cold, 16ms once
  # warm. Keeping it resident avoids that stall on the first build after an idle
  # period; the model is only 274 MB.
  embedding-keep-alive: "30m"
  embedding-timeout-seconds: 30

  # How many past plans to show the model.
  max-examples-in-prompt: 3

  # Ollama-only servers have freeform build planning disabled by default.
  # Once this many successful builds are remembered, the retrieved examples
  # carry enough of the load to unlock it. Set very high to keep it off.
  min-successes-for-reduced-mode-builds: 20

  # Undoing a build within this many minutes marks its plan as failed.
  negative-signal-window-minutes: 10

  # How similar a past request must be before its plan is worth showing.
  #
  # This is checked against the REQUEST-similarity score on its own, before the
  # situation match is blended in -- the situation term is a big constant offset
  # and would rescue irrelevant matches if the floor were applied after it.
  #
  # Scales differ per path, so there are two. Measured on nomic-embed-text
  # against "build me a cozy oak cottage": a near-identical request scores 0.86,
  # a loosely related one 0.58, and completely unrelated text still scores
  # 0.34-0.42 -- the model has a high baseline, so this floor must sit well above
  # zero to mean anything.
  min-text-relevance: 0.55      # embedding path (cosine)
  min-keyword-relevance: 0.15   # fallback path when Ollama is down (Jaccard)

  # How much of a stored plan to show before truncating.
  max-plan-chars: 1200

# ========== MINING CONFIGURATION ==========
mining:
  # Search and movement
  search-radius: 16           # How far to look for ores (blocks)
  move-speed: 0.25            # Movement speed (0.1-0.5)
  reach-distance: 4.5         # Mining reach (blocks)
  mining-tick-rate: 5         # Check frequency (ticks, lower = faster)
  pickup-radius: 8            # Item pickup range (blocks)
  
  # Depth and safety
  max-depth-below-start: 10   # Max blocks below starting Y
  hard-bedrock-limit: 10      # Never mine below this Y level
  
  # Climbing
  climb-height-threshold: 2   # Climb if ore is this many blocks up
  max-pillar-height: 8        # Maximum dirt pillar height
  use-dirt-pillars: true      # Use dirt blocks for climbing
  
  # Vein mining (NEW in 0.0.6)
  enable-vein-mining: true    # Mine entire ore veins
  max-vein-size: 64           # Maximum blocks in a vein
  vein-search-radius: 3       # How far to search for connected ores
  
  # Branch mining (NEW in 0.0.6)
  enable-branch-mining: false # Systematic mining patterns
  branch-spacing: 3           # Blocks between branches
  branch-length: 16           # Length of each branch
  tunnel-height: 2            # Height of mining tunnels
  
  # Torch placement (DISABLED by default in 0.0.7)
  place-torches: false        # Auto-place torches while mining
  torch-spacing: 8            # Blocks between torches
  torch-on-floor: true        # Place torches on floor vs walls

  # Phase 1: Safety settings (NEW in 0.0.7)
  use-navigator: true         # Use Citizens pathfinding (recommended)
  safety:
    avoid-lava: true          # Avoid lava blocks
    avoid-water: true         # Avoid swimming through water
    avoid-fire: true          # Avoid fire blocks
    min-y-level: -60          # Never mine below this Y level

  # Phase 1: Stuck recovery (NEW in 0.0.7)
  stuck-recovery:
    teleport-threshold: 60    # Ticks before teleporting to player (60 = 3 sec)
    mine-around: true         # Try mining surrounding blocks when stuck

  # Auto-return
  auto-return-threshold: 90   # Return when inventory this % full
  auto-return-enabled: true   # Enable auto-return feature
  
  # Visual feedback
  visual-feedback:
    particles: true           # Show particle effects
    chat-messages: true       # Show chat progress updates
    ore-discovery-alert: true # Alert when ore found
    vein-size-report: true    # Report vein sizes
    inventory-warnings: true  # Warn when inventory filling
  
  # Debug mode
  debug: false                # Enable detailed logging

  # Phase 3: Plugin integrations
  integrations:
    denizen:
      enabled: true           # Enable Denizen scripting events
      scripts-folder: jarvis  # Folder in Denizen/scripts/ for Jarvis scripts
    worldguard:
      enabled: true           # Enable WorldGuard region protection
      respect-regions: true   # Respect protected regions
      warn-on-deny: true      # Warn player when mining is denied

# ========== COMBAT CONFIGURATION ==========
combat:
  auto-return-low-health: false  # Return when health low
  health-threshold: 30           # Return at this health %
  combat-tick-rate: 10           # Check frequency (ticks)
  attack-radius: 16              # Search radius for mobs

# ========== BUILDING CONFIGURATION ==========
build:
  # Performance
  blocks-per-tick: 50            # Blocks to place per tick
  progress-update-interval: 100  # Show progress every N blocks
  
  # Features
  enable-undo: true              # Allow build undo (NEW in 0.0.6)
  undo-timeout: 300              # Seconds before undo expires
  max-undo-size: 10000           # Max blocks that can be undone
  
  # Materials
  fallback-material: minecraft:dirt  # Use if material not found
  
  # AI Building
  max-ai-blocks: 5000            # Max blocks for AI-generated builds
  ai-timeout: 30                 # Seconds to wait for AI response

# ========== MINING (v0.1.0 rework) ==========
mining:
  debug: false                   # Verbose mining debug logging
  search-radius: 24              # Ore search radius in blocks (async scan)
  navigator-range: 64.0          # Max pathfinding distance
  use-async-pathfinder: true     # Use Citizens' async A* (recommended)
  timed-breaking: true           # Vanilla-speed block breaking with animations
  break-speed-modifier: 1.0      # >1.0 mines faster, <1.0 slower
  auto-deposit: true             # Deliver loot to the registered chest when bags fill

  # Branch mine layout (/jarvis mine here)
  branch:
    target-y: -54                # Depth the staircase descends to (diamond level)
    corridor-length: 32          # Main gallery length in blocks
    branch-length: 12            # Length of each side branch
    branch-spacing: 3            # Blocks between branch pairs
    place-torches: true          # Light the mine as he digs
    torch-interval: 8            # Torch every N blocks

# ========== NATURAL LANGUAGE CONFIGURATION ==========
natural-language:
  enabled: true                  # Enable chat commands
  prefix: "jarvis"               # Command prefix
  require-prefix: false          # Must start with prefix
  cooldown-ms: 2000              # Millisecond cooldown between commands

# ========== DATABASE CONFIGURATION ==========
databases:
  file: databases.yml            # Database configuration file

# ========== CONFIG MANAGEMENT ==========
config-copies:
  folder: config-copies          # Backup folder for configs
  
# ========== FEATURE FLAGS ==========
features:
  # Core features
  npc-system: true               # Enable NPC companions
  building-system: true          # Enable building features
  schematic-system: true         # Enable schematic features
  
  # Advanced features
  multi-npc: false               # Allow multiple NPCs per player (experimental)
  voice-commands: false          # Voice command support (experimental)
  
# ========== PERFORMANCE TUNING ==========
performance:
  # Async operations
  use-async-ai: true             # AI calls async
  use-async-schematics: true     # Schematic operations async
  
  # Limits
  max-concurrent-builds: 5       # Max simultaneous builds on server
  max-concurrent-ai-calls: 10    # Max simultaneous AI API calls
  
  # Cache
  cache-ai-responses: true       # Cache AI responses
  cache-duration: 3600           # Cache duration (seconds)

# ========== UI CONFIGURATION ==========
ui:
  # Colors (Minecraft color codes)
  primary-color: "&6"            # Gold
  secondary-color: "&e"          # Yellow
  success-color: "&a"            # Green
  error-color: "&c"              # Red
  info-color: "&7"               # Gray
  
  # Messages
  prefix: "&6[Jarvis]&r "        # Message prefix
  use-unicode: true              # Use unicode symbols (✓, •, etc)

# ========== PERMISSIONS ==========
# See plugin.yml for permission nodes

# ========== DEVELOPMENT ==========
dev:
  debug-mode: false              # Extra debug logging
  test-mode: false               # Skip some validations
  log-api-calls: false           # Log all API calls

# ========== DEFENDER (v0.4.0) ==========
defender:
  engage-radius: 12.0            # How far from the anchor Jarvis engages hostiles
  leash-range: 12.0              # Chase distance before he breaks off and returns
  attack-damage: 7.0             # Damage per swing (7.0 = diamond sword)
  attack-cooldown-ticks: 12      # Ticks between swings
  callouts: true                 # "Creeper, behind you, sir."

# ========== STEWARD (v0.5.0) ==========
steward:
  report-on-join: true           # Briefing when a player joins
  report-join-delay-ticks: 60    # Delay before the join briefing (3s)
  supply-handoff: true           # Offer food / replacement tools from his bags
  charm: true                    # Waves, greetings after time away, idle glances
  celebrations: true             # Short victory bop after big milestones
  recovery:
    auto: false                  # true = fetch death drops without being asked
    max-distance: 192.0          # How far he'll travel for a recovery run

# ========== FARMING & GROUNDS (v0.7.0) ==========
farming:
  field-radius: 16               # Crop scan radius around where he starts
  replant-saplings: true         # Lumberjack replants after felling

# ========== LIGHTING (v0.8.0) ==========
# /jarvis light [radius] [type] [spacing] — spawn-proof the area.
# The math: mobs spawn at block-light 0; a torch emits 14 and loses 1 per
# block, so a grid spaced 13 or less keeps everything above light 0.
lighting:
  default-type: torch            # torch | end_rod | lantern
  default-radius: 16             # Area radius when the command gives none
  default-spacing: 12            # Grid spacing (12 = spawn-proof with margin)
  placement: ground              # ground | wall (wall applies to torches, when a wall is adjacent)
  skip-light-level: 8            # Skip spots already at this block-light or brighter (16 = never skip)
  underwater: sea_lantern        # sea_lantern | skip — grid points in shallow water (<=4 deep)
                                 # get a sea lantern on the floor (torches don't survive underwater);
                                 # "skip" leaves water untouched. Deep water is always skipped.

name: Jarvis
version: ${project.version}
main: com.gadgetman.jarvis.Jarvis
api-version: 1.21
depend: [Citizens]
softdepend: [WorldEdit, WorldGuard]
# GraalJS, which runs the model-written build scripts. Downloaded once on first
# start and cached in the server's libraries/ folder, which keeps this jar at
# ~1 MB rather than ~60 MB. If it cannot be resolved the plugin still loads and
# freeform builds fall back to the JSON planner -- see build.planner in config.
libraries:
  - org.graalvm.polyglot:polyglot:25.3.4.1
  - org.graalvm.js:js-language:25.3.4.1
  - org.graalvm.truffle:truffle-runtime:25.3.4.1
commands:
  jarvis:
    description: Jarvis AI Companion commands
    usage: /jarvis <subcommand>
    permission: jarvis.use
permissions:
  jarvis.use:
    description: Basic Jarvis usage
    default: true
  jarvis.admin:
    description: Admin Jarvis features
    default: op
  jarvis.menu.use:
    description: Use Jarvis control menu via bell or right-click
    default: true
